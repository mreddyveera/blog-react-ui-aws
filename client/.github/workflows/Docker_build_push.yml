name: Docker Image Build and push to a Registry
'on':
    pull_request:
        branches:
            - develop
            - main
        types: [opened, synchronize, reopened]
    push:
        branches:
            - develop
            - main
permissions:
    contents: read
    security-events: write

jobs:
    build-and-push:
        name: Build and push docker image
        runs-on: ubuntu-22.04
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: Generate Image Tag
              run: |
                echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
            - name: Setup docker buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: ./client
                file: ./client/Dockerfile
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-react-ui:${{ env.SHORT_SHA }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blog-react-ui:${{ env.SHORT_SHA }}'
                format: 'sarif'
                output: 'trivy-results.sarif'
                severity: 'CRITICAL,HIGH'
                exit-code: '1'
                ignore-unfixed: true

            - name: Upload Trivy results top Github Security
              uses: github/codeql-action/upload-sarif@v4
              with:
                sarif_file: 'trivy-resultys.sarif'

            

            
            
