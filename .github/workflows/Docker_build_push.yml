name: Docker Image Build and push to a Registry
'on':
    # pull_request:
    #     branches:
    #         - develop
    #         - main
    push:
        branches:
            - develop
            - main
            - 'feature/**'

permissions:
    contents: read
    security-events: write
    id-token: write

jobs:
    build-and-push:
        name: Build and push docker image
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Generate Image Tag
              run: |
                echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker image
              working-directory: ./client
              run : |
                docker buildx build \
                  --load \
                  -t ${{vars.REPO_NAME}}:${{env.SHORT_SHA}} \
                  .

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: '${{vars.REPO_NAME}}:${{ env.SHORT_SHA }}'
                format: 'sarif'
                output: 'trivy-results.sarif'
                severity: 'CRITICAL'
                exit-code: '1'
                ignore-unfixed: true

            - name: Upload Trivy results to GitHub Security
              if: always()
              uses: github/codeql-action/upload-sarif@v4
              with:
                sarif_file: 'trivy-results.sarif'

            - name: AWS LOGIN
              uses: aws-actions/configure-aws-credentials@v4
              with: 
                role-to-assume: ${{ vars.ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Ecr login
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            - name: Push the image to ECR Repositoty
              run: |
                docker tag \
                  ${{vars.REPO_NAME}}:${{env.SHORT_SHA}}
                  ${{steps.ecr-login.outputs.registry}}/${{vars.REPO_NAME}}:${{env.SHORT_SHA}}

                docker push \
                  ${{steps.ecr-login.outputs.registry}}/${{vars.REPO_NAME}}:${{env.SHORT_SHA}}
